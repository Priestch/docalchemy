[project]
dependencies = [
    "docalchemy @ file:///${PROJECT_ROOT}/../docalchemy",
    "docalchemy-gateway @ file:///${PROJECT_ROOT}/../docalchemy/packages/docalchemy-gateway",
    "python-dotenv>=1.0.0",
    "litestar-vite[nodeenv]>=0.1.21",
    "celery[redis]>=5.4.0",
    "litestar[standard]>=2.13.0",
    "advanced-alchemy[uuid]>=0.26.2,<1.0.0",
    "PyPDF2",
    "pydantic>=2.0.0",
    "asyncpg",
    "palitra>=0.1.0",
]
name = "docalchemy"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.scripts]
app = "app.__main__:run_cli"

[project.optional-dependencies]
dev = ["nodeenv"]
linting = ["pre-commit>=3.4.0", "mypy>=1.5.1", "ruff>=0.0.287", "slotscheck", "types-click", "types-passlib", "types-python-jose", "types-pyyaml", "types-redis", "asyncpg-stubs", "pylint"]
test = ["pytest", "pytest-xdist", "pytest-mock", "pytest-cov", "coverage", "pytest-sugar", "pytest-databases[postgres,redis]>=0.1.0"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "nodeenv"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["src/"]
packages = ["src/app"]

[tool.hatch.build.targets.app]

[tool.pdm.scripts]
lint = "pdm run pre-commit run --all-files"
post_install = "pdm run python scripts/pre-build.py --install-packages"
pre_build = "pdm run python scripts/pre-build.py --build-assets"
start-infra = "docker-compose -f docker-compose.infra.yml up --force-recreate -d --build"
stop-infra = "docker-compose -f docker-compose.infra.yml down --remove-orphans"
test = "pdm run pytest tests"

[tool.pdm.scripts.test_coverage]
composite = ["pdm run pytest tests", "pdm run coverage html", "pdm run coverage xml"]

[tool.pdm.dev-dependencies]
dev = ["nodeenv"]
linting = ["pre-commit>=3.4.0", "mypy>=1.5.1", "ruff>=0.0.287", "slotscheck", "types-click", "types-passlib", "types-python-jose", "types-pyyaml", "types-redis", "asyncpg-stubs", "pylint"]
test = ["pytest", "pytest-xdist", "pytest-mock", "pytest-cov", "coverage", "pytest-sugar", "pytest-databases[postgres,redis]>=0.1.0"]

[tool.black]
exclude = "/(\n    \\.git\n  | \\.mypy_cache\n  | \\.tox\n  | venv\n  | \\.venv\n  | _build\n  | buck-out\n  | build\n  | dist\n)/\n"
include = "\\.pyi?$"
line-length = 100

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "pragma: no cover", "if __name__ == .__main__.:", "def __repr__", "if self\\.debug:", "if settings\\.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod"]
omit = ["*/tests/*"]
show_missing = true

[tool.coverage.run]
branch = true
omit = ["tests/*", "**/*/migrations/**/*.py", "scripts/*"]

[tool.pytest.ini_options]
addopts = ["-ra", "--ignore", "migrations"]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources", "ignore::DeprecationWarning:google.*", "ignore::DeprecationWarning:passlib.*", "ignore::DeprecationWarning:aiosql.*", "ignore::DeprecationWarning:litestar.constants.*", "ignore::DeprecationWarning:litestar.utils.*", "ignore::DeprecationWarning:litestar.cli.*", "ignore::DeprecationWarning:httpx._client"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".bzr", ".direnv", ".eggs", ".git", ".hg", ".mypy_cache", ".nox", ".pants.d", ".ruff_cache", ".svn", ".tox", ".venv", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "venv", "__pycache__", "src/app/db/migrations/versions/*.py"]
fix = true
line-length = 120
src = ["src", "tests/"]
target-version = "py311"

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D202", "D205", "D415", "UP037", "A003", "B010", "B008", "RUF012", "ANN401", "ANN102", "ANN101", "PLR0913", "PLR2004", "FBT001", "FBT002", "FBT003", "ARG002", "ARG001", "TD002", "TD003", "FIX002", "PGH003", "RUF006", "SLF001", "PT007", "PT004", "PT005", "S603", "E501", "PLW2901", "ANN401", "ANN102", "ANN101", "FBT", "PLR0913", "PT", "TD", "PERF203", "G004"]
select = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "sqlalchemy.ext.declarative.declared_attr", "sqlalchemy.orm.declared_attr.directive", "sqlalchemy.orm.declared_attr"]

[tool.ruff.lint.isort]
known-first-party = ["tests", "app"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["D104", "D103", "D205", "D212"]
"__init__.py" = ["F401", "D104"]
"docs/**/*.*" = ["S", "B", "DTZ", "A", "TCH", "ERA", "D", "RET", "E731", "RUF012", "FA100", "ARG001"]
"docs/conf.py" = ["FIX002", "ARG001", "INP001"]
"scripts/**/*.*" = ["D", "ARG", "EM", "TRY", "G", "FBT", "INP001"]
"scripts/*.py" = ["INP001", "ERA001"]
"src/app/db/migrations/versions/*.py" = ["ANN201", "INP001"]
"tests/*.py" = ["D103", "S101", "D104"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.slotscheck]
strict-imports = false

[tool.codespell]
ignore-words-list = "alog"
skip = "pdm.lock, package-lock.json"

[tool.mypy]
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = "(?x)(\n^build/\n|^dist/\n|^.venv/\n|^node_modules/\n|^migrations/\n)\n"
implicit_reexport = false
plugins = []
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disallow_untyped_decorators = false
module = ["tests.*"]

[[tool.mypy.overrides]]
disallow_untyped_calls = false
disallow_untyped_decorators = false
module = ["aisoql.*"]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["sqlalchemy.*", "saq.*", "uvicorn.*", "aiohttp.*", "jsbeautifier", "jsbeautifier.*", "uvloop", "uvloop.*", "nodeenv"]

[[tool.mypy.overrides]]
ignore_errors = true
module = ["app.db.migrations.*", "app.lib.dto.*"]

[tool.pyright]
exclude = ["scripts", "docs"]
include = ["src/app", "tests"]

[tool.git-cliff.changelog]
body = "{% if version %}`Release [v{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }} <https://github.com/litestar-org/litestar-fullstack/releases/tag/v{{ version | trim_start_matches(pat=\"v\") }}>`_\n    ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n    * `See All commits in v{{ version | trim_start_matches(pat=\"v\") }} <https://github.com/litestar-org/litestar-fullstack/commits/v{{ version | trim_start_matches(pat=\"v\") }}>`_\n{% else %}[unreleased]\n    ----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n{% endif %}{% if previous %}{% if previous.commit_id %}\n        `{{ previous.commit_id | truncate(length=7, end=\"\") }} <https://github.com/litestar-org/litestar-fullstack/commit/{{ previous.commit_id }}>`_ ... `{{ previous.commit_id | truncate(length=7, end=\"\") }} <https://github.com/litestar-org/litestar-fullstack/commit/{{ commit_id }}>`_ | `See diff for {{ version }} <https://github.com/litestar-org/litestar-fullstack/compare/{{ previous.commit_id }}...{{ commit_id }}>`_\n    {% endif %}{% endif %}{% for group, commits in commits | group_by(attribute=\"group\") %}\n    {{ group | upper_first }}\n    ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\n    {% for commit in commits %}\n        * (`{{ commit.id | truncate(length=7, end=\"\") }} <https://github.com/litestar-org/litestar-fullstack/commit/{{ commit.id }}>`_) {% if commit.breaking %}[**breaking**] {% endif %} - {{ commit.message | upper_first }} ({{ commit.author.name }}){% for footer in commit.footers -%}\n            , {{ footer.token }}{{ footer.separator }}{{ footer.value }}{% endfor %}{% endfor %}\n{% endfor %}\n\n"
footer = "Litestar Fullstack Changelog\n"
header = "=========\nChangelog\n=========\n\nAll commits to this project will be documented in this file.\n\n"
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_commits = false
filter_unconventional = true
ignore_tags = ""
protect_breaking_commits = false
skip_tags = "v0.1.0-beta.1"
sort_commits = "oldest"
split_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
[[tool.git-cliff.git.commit_parsers]]
message = "^feat"
group = "Features"

[[tool.git-cliff.git.commit_parsers]]
message = "^fix"
group = "Bug Fixes"

[[tool.git-cliff.git.commit_parsers]]
message = "^doc"
group = "Documentation"

[[tool.git-cliff.git.commit_parsers]]
message = "^perf"
group = "Performance"

[[tool.git-cliff.git.commit_parsers]]
message = "^refactor"
group = "Refactor"

[[tool.git-cliff.git.commit_parsers]]
message = "^style"
group = "Styling"

[[tool.git-cliff.git.commit_parsers]]
message = "^test"
group = "Testing"

[[tool.git-cliff.git.commit_parsers]]
message = "^chore\\(release\\): prepare for"
skip = true

[[tool.git-cliff.git.commit_parsers]]
message = "^chore"
group = "Miscellaneous Tasks"

[[tool.git-cliff.git.commit_parsers]]
body = ".*security"
group = "Security"
