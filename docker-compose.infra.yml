name: docalchemy

services:
  redis:
    image: valkey/valkey:latest
    ports:
      - "16377:6379"
    command: redis-server --appendonly yes
    volumes:
      - cache-data:/data
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    image: postgres:latest
    ports:
      - "15433:5432"
    hostname: db
    environment:
      POSTGRES_PASSWORD: "app"
      POSTGRES_USER: "app"
      POSTGRES_DB: "app"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 3s
      retries: 40

  docling:
    build:
      context: .
      dockerfile: Dockerfile
      target: docling
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    # Cap concurrency: docling's layout stage is CPU-heavy; running many huge
    # docs at once oversubscribes cores and risks OOM. 2 at a time keeps each
    # run fast and memory-bounded. Drop the override to use the CPU-count default.
    command: ["celery", "-A", "app.infrastructure.workers.celery_app:celery_app", "worker", "-Q", "analysis.docling", "-c", "2", "--loglevel=debug"]
    environment: &worker-env
      STORAGE_ROOT_PATH: /app/storage
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/cache/huggingface
      HF_HUB_CACHE: /app/cache/huggingface/hub
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache

  opendataloader:
    build:
      context: .
      dockerfile: Dockerfile
      target: opendataloader
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    environment:
      <<: *worker-env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache

  mineru:
    build:
      context: .
      dockerfile: Dockerfile
      target: mineru
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
    environment:
      <<: *worker-env
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache

  surya:
    build:
      context: .
      dockerfile: Dockerfile
      target: surya
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    environment:
      <<: *worker-env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache

  franken_ocr:
    build:
      context: .
      dockerfile: Dockerfile
      target: franken_ocr
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-}"
    environment:
      <<: *worker-env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage
      - ./cache:/app/cache

volumes:
  db-data:
    name: docalchemy-db-data
  cache-data:
    name: docalchemy-cache-data
