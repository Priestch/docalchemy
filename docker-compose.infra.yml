name: docalchemy1

services:
  redis:
    image: valkey/valkey:latest
    ports:
      - "16377:6379"
    command: redis-server --appendonly yes
    volumes:
      - cache-data:/data
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    image: postgres:latest
    ports:
      - "15433:5432"
    hostname: db
    environment:
      POSTGRES_PASSWORD: "app"
      POSTGRES_USER: "app"
      POSTGRES_DB: "app"
    volumes:
      - db-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      timeout: 3s
      retries: 40

# Analysis providers are NOT defined here. They run as separate containers
# from the docalchemy repo (docker compose up -d in ~/Enter/docalchemy), and
# the Celery pack workers run on the host via `make dev-workers`. Providers:
#   docling http://localhost:8081, mineru :8082, opendataloader :8083,
#   franken_ocr :8084

volumes:
  db-data:
    name: docalchemy-db-data
  cache-data:
    name: docalchemy-cache-data
